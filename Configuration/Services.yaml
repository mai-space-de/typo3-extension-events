services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiEvents\:
    resource: '../Classes/*'
    exclude:
      - '../Classes/Domain/Model/*'

  Maispace\MaiEvents\EventProvider\EventProviderInterface:
    tags:
      - name: maispace.events.event_provider

  Maispace\MaiEvents\EventProvider\TxEventProvider:
    public: true
    tags:
      - name: maispace.events.event_provider

  Maispace\MaiEvents\Domain\Repository\EventRepository:
    public: true

  # EventsDataProcessor is instantiated by TYPO3's FLUIDTEMPLATE via GeneralUtility::makeInstance()
  # It resolves event providers from container at runtime (no constructor injection)

  # DataHandler instantiates hooks via GeneralUtility::makeInstance() — must be public for DI
  Maispace\MaiEvents\Hook\EventCacheInvalidationHook:
    public: true

  Maispace\MaiEvents\Controller\EventsController:
    public: true

  Maispace\MaiEvents\Controller\RegistrationController:
    public: true

  Maispace\MaiEvents\Controller\Backend\RegistrationBackendController:
    public: true

  Maispace\MaiEvents\Indexer\EventIndexer:
    tags:
      - name: 'maispace.search.indexer'
      - name: 'maispace.search.result_formatter'
