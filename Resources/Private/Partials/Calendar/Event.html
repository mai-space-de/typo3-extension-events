<html
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    Single event partial — redesigned to match BGM Pulheim design system.
    Arguments:
      {event}   – Maispace\MaiEvents\Domain\Model\Event instance
      {compact} – 1 for compact (no description), 0 for full display
</f:comment>

<article class="mai-calendar__event {f:if(condition: compact, then: 'mai-calendar__event--compact')}">

    <div class="mai-calendar__event-date">
        <span class="mai-calendar__event-day">
            <f:format.date format="j" date="{event.start}" />
        </span>
        <span class="mai-calendar__event-month">
            <f:format.date format="M" date="{event.start}" />
        </span>
    </div>

    <div class="mai-calendar__event-body">
        <h3 class="mai-calendar__event-title">
            <f:if condition="{event.url}">
                <f:then>
                    <a href="{event.url}">{event.title}</a>
                </f:then>
                <f:else>
                    {event.title}
                </f:else>
            </f:if>
        </h3>

        <div class="mai-calendar__event-meta">
            <time
                class="mai-calendar__event-time"
                datetime="{f:format.date(format: 'c', date: event.start)}"
            >
                <f:if condition="{event.allDay}">
                    <f:then>
                        <f:translate key="calendar.allDay" extensionName="mai_events" />
                    </f:then>
                    <f:else>
                        <f:format.date format="H:i" date="{event.start}" />
                        –
                        <f:format.date format="H:i" date="{event.end}" />
                    </f:else>
                </f:if>
            </time>

            <f:if condition="{event.location}">
                <span class="mai-calendar__event-location">
                    {event.location}
                </span>
            </f:if>
        </div>

        <f:if condition="{compact} == 0">
            <f:if condition="{event.description}">
                <div class="mai-calendar__event-description">
                    <f:format.html>{event.description}</f:format.html>
                </div>
            </f:if>
        </f:if>
    </div>

</article>

</html>
